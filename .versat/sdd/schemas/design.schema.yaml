$schema: https://json-schema.org/draft/2020-12/schema
title: Versat SDD design metadata
type: object
additionalProperties: false
required: [change, requirements, validation]
properties:
  change:
    type: string
  requirements:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: '^REQ-[0-9]{3,}$'
  adrs:
    type: array
    uniqueItems: true
    items:
      type: string
  validation:
    type: array
    minItems: 1
    items:
      type: string
