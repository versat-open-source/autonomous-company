$schema: https://json-schema.org/draft/2020-12/schema
title: Versat SDD requirement collection
type: object
additionalProperties: false
required: [change, requirements]
properties:
  change:
    type: string
  requirements:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, statement, acceptance]
      properties:
        id:
          type: string
          pattern: '^REQ-[0-9]{3,}$'
        statement:
          type: string
          minLength: 1
        acceptance:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
