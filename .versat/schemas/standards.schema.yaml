$schema: https://json-schema.org/draft/2020-12/schema
title: Versat Standards lock
type: object
additionalProperties: false
required: [schema_version, harness, resolved_at, standards]
properties:
  schema_version:
    const: 1
  harness:
    type: object
    additionalProperties: false
    required: [version, commit]
    properties:
      version:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'
      commit:
        type: string
        minLength: 1
  resolved_at:
    type: string
    minLength: 1
  standards:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [path, version, digest]
      properties:
        path:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        digest:
          type: string
          minLength: 1
